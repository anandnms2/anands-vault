name: diag
on:
  push:
    paths: ['.github/workflows/diag.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and export runnable bundle
        run: |
          set +e
          docker build --build-arg PUBLIC_URL=https://pass.anands.xyz -t av . > build.log 2>&1
          docker create --name avx av >/dev/null 2>&1
          mkdir -p b/wv b/tpl
          docker cp avx:/web-vault/. b/wv/
          docker cp avx:/branding/templates/. b/tpl/
          docker cp avx:/vaultwarden b/vaultwarden
          docker cp avx:/lib b/lib 2>/dev/null
          docker cp avx:/usr/lib b/usrlib 2>/dev/null
          find b/wv -name '*.map' -delete
          find b/wv -name '*.wasm' -size +2M -print
          tar czf bundle.tgz -C b .
          ls -la bundle.tgz > size.txt; docker run --rm --entrypoint sh av -c 'cat /etc/os-release | head -2; ldd /vaultwarden | head -20' >> size.txt 2>&1
          git config user.name gha; git config user.email gha@users.noreply.github.com
          git checkout -q --orphan scratch
          git rm -rf . -q
          cp bundle.tgz size.txt .
          git add bundle.tgz size.txt && git commit -qm bundle && git push -f origin scratch
