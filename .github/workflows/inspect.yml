name: inspect
on:
  push:
    paths: ['.github/workflows/inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect web vault
        run: |
          set +e
          mkdir -p report
          docker create --name vwx vaultwarden/server:latest >/dev/null 2>&1
          docker cp vwx:/web-vault ./wv >/dev/null 2>&1
          cd wv
          {
            echo "## new-logo-themed anywhere"
            grep -rhoE '.{0,160}new-logo-themed.{0,300}' --include=*.css --include=*.html . | head -12
            echo; echo "## bwi-bitwarden-shield css"
            grep -rhoE '.{0,40}bwi-bitwarden-shield[^}]{0,200}\}' --include=*.css . | head -8
            echo; echo "## other bitwarden-logo css classes"
            grep -rhoE '[.a-z_-]*(bitwarden|logo)[a-z_-]*[^{}]{0,60}\{[^}]{0,200}\}' styles.*.css | head -30
            echo; echo "## svg path-heavy components in main.js: ids of logo svg (aria/title)"
            grep -rhoE '.{100}(Bitwarden logo|bitwarden logo|logoLabel|aria-label","Bitwarden).{100}' --include=*.js . | head -10
            echo; echo "## webauthn connector titles"
            grep -ohE '<title>[^<]*</title>' ./*.html
          } > ../report/web-vault3.txt 2>&1
          cd ..
          git config user.name gha; git config user.email gha@users.noreply.github.com
          git add report && git commit -qm "inspect report 2"; git pull -q --rebase origin main; git push
