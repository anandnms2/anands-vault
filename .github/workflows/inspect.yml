name: inspect
on:
  push:
    paths: ['.github/workflows/inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect web vault
        run: |
          set +e
          mkdir -p report
          docker create --name vwx vaultwarden/server:latest >/dev/null 2>&1
          docker cp vwx:/web-vault ./wv >/dev/null 2>&1
          cd wv
          {
            echo "## css rules for logo classes"
            grep -ohE '[^}]{0,200}(new-logo|logo-themed|logo-white|logo-dark|logo\.svg)[^{]{0,200}\{[^}]*\}' styles.*.css | head -20
            echo; echo "## js: class/identifier hints"
            grep -rhoE '.{80}(new-logo-themed|bitwarden-logo|BitwardenLogo|BitwardenShield|bitwarden-shield|logo-themed).{120}' --include=*.js . | head -25
            echo; echo "## js files with inline wordmark/shield svg (viewBox)"
            grep -rhoE 'viewBox:? ?"0 0 [0-9.]+ [0-9.]+"' --include=*.js . | sort | uniq -c | sort -rn | head -25
            echo; echo "## svg files with 'bitwarden' text"
            grep -rliE 'bitwarden|vaultwarden' --include=*.svg --include=*.json --include=*.html --include=*.xml . | head -30
            echo; echo "## 'Vaultwarden' count in app js & locales"
            grep -rlc 'Vaultwarden' --include=*.js . | head; ls locales | wc -l
            echo; echo "## .logo/tw-logo style sheets mentioning background logos"
            grep -ohE '[^}]{0,120}url\(images/logo[^)]*\)[^}]{0,120}\}' styles.*.css | head
          } > ../report/web-vault2.txt 2>&1
          cd ..
          git config user.name gha; git config user.email gha@users.noreply.github.com
          git add report && git commit -qm "inspect report 2"; git pull -q --rebase origin main; git push
