name: inspect
on:
  push:
    paths: ['.github/workflows/inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect web vault
        run: |
          set +e
          mkdir -p report
          docker create --name vwx vaultwarden/server:latest >/dev/null 2>&1
          docker cp vwx:/web-vault ./wv >/dev/null 2>&1
          cd wv
          {
            echo "## img.new-logo-themed css"
            grep -ohE '[^}]{0,60}img\.new-logo-themed[^}]*\}' styles.*.css | head
            echo; echo "## svg viewBoxes in js (count)"
            grep -rhoE 'viewBox=.{1,3}[0-9.]+ [0-9.]+ [0-9.]+ [0-9.]+' --include=*.js . | sort | uniq -c | sort -rn | head -40
            echo; echo "## logo-ish svg literals: file, viewBox, first 200 chars"
            for f in $(grep -rlE 'viewBox' --include=*.js . ); do
              grep -oE '<svg[^>]{0,200}viewBox=.{1,3}0 0 (290|44|45|50|40|52|56|64|75|76|77|128|130|135|149|150|250|256|300) [0-9.]+[^>]{0,120}>.{0,160}' "$f" | head -6 | sed "s|^|$f: |"
            done | cut -c1-420 | head -40
            echo; echo "## bwi shield glyph class in js"
            grep -rhoE '.{60}bwi-bitwarden[a-z-]*.{60}' --include=*.js . | sort -u | head -12
            echo; echo "## service worker / cache headers"
            ls | grep -iE 'sw|service|workbox'
                    } > ../report/web-vault4.txt 2>&1
          cd ..
          git config user.name gha; git config user.email gha@users.noreply.github.com
          git add report && git commit -qm "inspect report 2"; git pull -q --rebase origin main; git push
