name: inspect4
on:
  push:
    paths: ['.github/workflows/inspect4.yml', 'scripts/inspect2.py']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          set +e
          mkdir -p report
          docker create --name vwx vaultwarden/server:latest >/dev/null 2>&1
          docker cp vwx:/web-vault ./wv >/dev/null 2>&1
          python3 scripts/inspect2.py > report/py4.log 2>&1
          git config user.name gha; git config user.email gha@users.noreply.github.com
          git add report && git commit -qm "inspect report 8"; git pull -q --rebase origin main; git push
