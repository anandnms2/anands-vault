name: build
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read upstream version
        id: v
        run: echo "tag=$(tr -d '[:space:]' < upstream-version.txt)" >> "$GITHUB_OUTPUT"
      - name: Build (not pushed yet)
        run: |
          docker build --build-arg PUBLIC_URL=https://pass.anands.xyz \
            --build-arg VW_VERSION=${{ steps.v.outputs.tag }} -t av:test .
      - name: Smoke test - server starts and branding is intact
        run: |
          set -e
          OUT=$(docker run -d --name avtest -p 18088:80 -e I_REALLY_WANT_VOLATILE_STORAGE=true -e DOMAIN=https://pass.anands.xyz av:test 2>&1) || { echo "::error::docker run failed: $OUT"; docker images 2>&1 | head -5; exit 1; }
          for i in $(seq 1 30); do curl -fsS localhost:18088/alive >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS localhost:18088/alive >/dev/null
          curl -fsS localhost:18088/ | grep -q "Anands Vault"
          curl -fsS localhost:18088/css/vaultwarden.css | grep -q "nav-bg-primary"
          if docker exec avtest sh -c 'grep -rlE "Vaultwarden Web|not associated with the Bitwarden" /web-vault/app /web-vault/index.html' | grep -q .; then
            echo "Branding leftovers found"; exit 1; fi
          docker exec avtest sh -c 'ls /web-vault/app | grep -cE "^main\.[0-9a-f]+\.js$" | grep -qx 1'
      - name: Debug info on failure
        if: failure()
        run: |
          echo "::error::$(docker ps -a 2>&1 | tr '\n' '|') LOGS: $(docker logs avtest 2>&1 | grep -v '^[| ]*$' | grep -iE 'error|panic|fail|warn|\[' | tail -8 | tr '\n' '|')"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          IMG=ghcr.io/anandnms2/anands-vault
          docker tag av:test $IMG:latest
          docker tag av:test $IMG:vw-${{ steps.v.outputs.tag }}
          docker push $IMG:latest
          docker push $IMG:vw-${{ steps.v.outputs.tag }}
