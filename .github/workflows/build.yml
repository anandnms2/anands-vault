name: build
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read upstream version
        id: v
        run: echo "tag=$(tr -d '[:space:]' < upstream-version.txt)" >> "$GITHUB_OUTPUT"
      - name: Build (not pushed yet)
        run: |
          docker build --build-arg PUBLIC_URL=https://pass.anands.xyz \
            --build-arg VW_VERSION=${{ steps.v.outputs.tag }} -t av:test .
      - name: Smoke test - server starts and branding is intact
        run: |
          set -e
          docker run -d --name t -p 8080:80 -e DOMAIN=https://pass.anands.xyz av:test
          for i in $(seq 1 30); do curl -fsS localhost:8080/alive >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS localhost:8080/alive >/dev/null
          curl -fsS localhost:8080/ | grep -q "Anands Vault"
          curl -fsS localhost:8080/css/vaultwarden.css | grep -q "nav-bg-primary"
          if docker exec t sh -c 'grep -rlE "Vaultwarden Web|not associated with the Bitwarden" /web-vault/app /web-vault/index.html' | grep -q .; then
            echo "Branding leftovers found"; exit 1; fi
          docker exec t sh -c 'ls /web-vault/app | grep -c "^main\." | grep -qx 1'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          IMG=ghcr.io/anandnms2/anands-vault
          docker tag av:test $IMG:latest
          docker tag av:test $IMG:vw-${{ steps.v.outputs.tag }}
          docker push $IMG:latest
          docker push $IMG:vw-${{ steps.v.outputs.tag }}
